name: Deploy - GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch: # manual retry from main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to check the tag is on main

      - name: Check tag is on main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main"; exit 1; }

      - name: Check manual run is on main
        if: github.event_name == 'workflow_dispatch'
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Manual deploy is only allowed from main"; exit 1; }'

      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != v${VERSION} (package.json)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build game
        env:
          NODE_ENV: production
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy - GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
