name: Test & Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'feature/issue-')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'feature/issue-')
        run: npm ci

      - name: Run tests
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'feature/issue-')
        run: npm test

      - name: Build production bundle
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'feature/issue-')
        run: npm run build

      - name: Build Docker image
        run: docker build --tag doomr:ci .
