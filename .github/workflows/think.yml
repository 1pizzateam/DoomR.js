name: Think on Ready Issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to generate think.md for'
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

jobs:
  think:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-think-issue-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Sync issue to Ready column on DoomR Project board
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          PROJECT_TITLE: DoomR
          TARGET_STATUS: Ready
        run: |
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) {
                  id
                }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE" 2>/dev/null || true)

          if [ -z "$DATA" ]; then
            echo "::notice::Skipping Project board sync (ensure COPILOT_GITHUB_TOKEN has 'project' scope to auto-move cards on the DoomR board)."
            exit 0
          fi

          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase) == ($title | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[] | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)

          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "::notice::Could not resolve DoomR Project board or '${TARGET_STATUS}' column (check token 'project' scope)."
            exit 0
          fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                item { id }
              }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) {
                projectV2Item { id }
              }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null

          echo "Moved issue #${ISSUE_NUMBER} to '${TARGET_STATUS}' on Project '${PROJECT_TITLE}'."

      - name: Check FIFO queue for Ready issues
        id: fifo
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Dispatched directly (FIFO handoff or manual run) for issue #${ISSUE_NUMBER}; proceeding."
            echo "queued=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1. Check if Plan, Code, or Prove is currently running or queued
          ACTIVE_PIPELINE_RUNS=0
          for wf in "Plan from Think Spec" "Code Plan and Open PR" "Prove and Validate PR"; do
            COUNT=$(gh run list --workflow "$wf" --limit 5 --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested")] | length' 2>/dev/null || echo "0")
            ACTIVE_PIPELINE_RUNS=$((ACTIVE_PIPELINE_RUNS + COUNT))
          done

          # 2. Check if another open agent PR is currently awaiting Prove/merge (excluding blocked needs:developer PRs)
          OPEN_AGENT_PRS=$(gh pr list --state open --json number,headRefName,labels \
            --jq "[.[] | select(.headRefName | test(\"^(feature|fix|chore)/issue-[0-9]+-\")) | select((.headRefName | test(\"^(feature|fix|chore)/issue-${ISSUE_NUMBER}-\")) | not) | select([.labels[].name] | index(\"needs:developer\") == null)] | length" 2>/dev/null || echo "0")

          # 3. Determine the head of the FIFO queue ordered by when the 'ready' label was applied (tie-broken by issue number)
          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], labels: ["ready"], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          QUEUE_HEAD=$(echo "$QUEUE_DATA" | jq -r '
            [
              .data.repository.issues.nodes[]?
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "ready") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ "$ACTIVE_PIPELINE_RUNS" -gt 0 ] || [ "$OPEN_AGENT_PRS" -gt 0 ] || { [ -n "$QUEUE_HEAD" ] && [ "$QUEUE_HEAD" != "$ISSUE_NUMBER" ]; }; then
            echo "::notice::Issue #${ISSUE_NUMBER} is queued in FIFO (head of queue: #${QUEUE_HEAD:-$ISSUE_NUMBER}, active runs: ${ACTIVE_PIPELINE_RUNS}, open PRs: ${OPEN_AGENT_PRS}). It will start automatically when the current issue completes."
            echo "queued=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Issue #${ISSUE_NUMBER} is at the head of the FIFO queue; starting Think."
          echo "queued=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.fifo.outputs.queued != 'true'

      - name: Install ALTEN-group/coding-pal think primitives
        if: steps.fifo.outputs.queued != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ALTEN-group/coding-pal.git /tmp/alten-coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/alten-coding-pal/instructions/sharp-agent.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/think.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/agents/think.agent.md .github/agents/
          cp -R /tmp/alten-coding-pal/skills/think .agents/skills/think
          rm -rf /tmp/alten-coding-pal

      - uses: actions/setup-node@v4
        if: steps.fifo.outputs.queued != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.fifo.outputs.queued != 'true'
        run: npm ci
      - if: steps.fifo.outputs.queued != 'true'
        run: npm install -g @github/copilot

      - name: Fetch issue context and run Thinker agent
        if: steps.fifo.outputs.queued != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels,comments)
          ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
          ALREADY_ESCALATED=$(echo "$ISSUE_JSON" | jq -r '[.labels[].name] | index("upstream-escalated:1") != null')
          UPSTREAM_RELEASE_NOTES=$(echo "$ISSUE_JSON" | jq -r '[.comments[].body | select(test("^## Upstream Library Released"; "m"))] | last // empty')
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          mkdir -p "$SPEC_DIR"

          ESCALATION_HINT=""
          if [ "$ALREADY_ESCALATED" != "true" ]; then
            ESCALATION_HINT="If you determine that generic math, physics, loop, audio, or rendering logic required for this issue belongs in an upstream @1pizzateam/* library (@1pizzateam/roostr -> 1pizzateam/RoostR.js, @1pizzateam/bumpr -> 1pizzateam/BumpR.js, @1pizzateam/loopr -> 1pizzateam/LoopR.js, @1pizzateam/spock -> 1pizzateam/Spock.js, @1pizzateam/groovr -> 1pizzateam/GroovR.js) rather than DoomR.js—and the installed version in node_modules does not yet export it—also write ${SPEC_DIR}/upstream-request.json with {\"package\": \"@1pizzateam/...\", \"repo\": \"1pizzateam/...\", \"library_issue_title\": \"...\", \"library_issue_body\": \"## Problem\\n...\\n## Proposed API\\n...\\n## Acceptance Criteria\\n- **AC-1:** ...\"}."
          fi

          EDITOR_SYNC_HINT="If implementing this DoomR.js feature or schema change also requires updating one or more of the 5 companion game editors (cadenza -> 1pizzateam/Cadenza for music/soundtrack racks, mappr -> 1pizzateam/MappR for level/map schemas & entities, pixelgun -> 1pizzateam/PixelGun for 2D procedural sprites/textures, polygun -> 1pizzateam/PolyGun for 3D procedural meshes/weapons, shadergun -> 1pizzateam/ShaderGun for WebGL2 post-process/material shaders), also write ${SPEC_DIR}/editor-requests.json containing a JSON array of objects: [{\"editor\": \"mappr\", \"title\": \"feat: ...\", \"body\": \"## Problem\\n...\\n## DoomR.js Contract Changes\\n...\\n## Acceptance Criteria\\n- **AC-1:** ...\"}]. These companion editor issues will be automatically created and labeled ready in the respective editor repositories as soon as this DoomR.js PR merges."

          copilot --agent="think" --allow-all-tools \
            --prompt "Produce a validated Think record at ${THINK_FILE} for GitHub Issue #${ISSUE_NUMBER}.
          Issue Title: ${ISSUE_TITLE}
          Issue Body:
          ${ISSUE_BODY}

          ${UPSTREAM_RELEASE_NOTES}

          Follow .github/instructions/think.instructions.md and .agents/skills/think/SKILL.md (and its references/think-contract.md).
          Because no Forge catalog is installed in this repository, evaluate options grounded in the codebase and existing package.json dependencies, set Custom build where applicable with Custom Build Reason in ## Chosen Approach and '- **None:** <reason>' in ## Forge Asset Bindings.
          ${ESCALATION_HINT}
          ${EDITOR_SYNC_HINT}
          Validate the generated file with: node .agents/skills/think/scripts/validate-think.mjs --think ${THINK_FILE} and fix any validation errors until it exits with code 0."

      - name: Check for upstream @1pizzateam/* library escalation
        id: escalate
        if: steps.fifo.outputs.queued != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          CURRENT_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          REQ_FILE="specs/issue-${ISSUE_NUMBER}/upstream-request.json"
          if [ ! -s "$REQ_FILE" ]; then
            echo "escalated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PKG=$(jq -r '.package // empty' "$REQ_FILE" 2>/dev/null || true)
          TARGET_REPO=$(jq -r '.repo // empty' "$REQ_FILE" 2>/dev/null || true)
          LIB_TITLE=$(jq -r '.library_issue_title // empty' "$REQ_FILE" 2>/dev/null || true)
          LIB_BODY=$(jq -r '.library_issue_body // empty' "$REQ_FILE" 2>/dev/null || true)

          if [ -z "$PKG" ] || [ -z "$TARGET_REPO" ] || [ -z "$LIB_TITLE" ] || [ "$TARGET_REPO" = "$CURRENT_REPO" ]; then
            rm -f "$REQ_FILE"
            echo "escalated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh label create "blocked:upstream" --repo "$CURRENT_REPO" --force --description "Waiting on an upstream @1pizzateam library release" || true
          gh label create "upstream-escalated:1" --repo "$CURRENT_REPO" --force --description "Escalated once to an upstream @1pizzateam library" || true
          gh label create "ready" --repo "$TARGET_REPO" --force --description "Ready for autonomous Think -> Plan -> Code -> Prove pipeline" || true
          gh label create "upstream-escalated:1" --repo "$TARGET_REPO" --force --description "Triggered by downstream consumer" || true

          LIB_ISSUE_URL=$(gh issue create --repo "$TARGET_REPO" \
            --title "$LIB_TITLE" \
            --label "ready" \
            --label "upstream-escalated:1" \
            --body "${LIB_BODY}

          ---
          ### Downstream Consumer Callback
          - **Downstream-Repo:** \`${CURRENT_REPO}\`
          - **Downstream-Issue:** #${ISSUE_NUMBER}
          - **Upstream-Escalated:** 1")
          LIB_ISSUE_NUMBER="${LIB_ISSUE_URL##*/}"

          gh issue comment "$ISSUE_NUMBER" --repo "$CURRENT_REPO" \
            --body "## Escalated to Upstream Library
          - **Waiting-Package:** \`${PKG}\`
          - **Waiting-Repo:** \`${TARGET_REPO}\`
          - **Upstream-Issue:** ${TARGET_REPO}#${LIB_ISSUE_NUMBER} (${LIB_ISSUE_URL})

          This issue is paused (\`blocked:upstream\`) while \`${TARGET_REPO}\` implements, proves, and publishes the new version of \`${PKG}\` to npm. Once released, this issue will automatically be re-labeled \`ready\` and resume."

          gh issue edit "$ISSUE_NUMBER" --repo "$CURRENT_REPO" \
            --add-label "blocked:upstream" \
            --add-label "upstream-escalated:1" \
            --remove-label "ready" || true

          echo "escalated=true" >> "$GITHUB_OUTPUT"

          # Advance FIFO queue to the next Ready issue in DoomR.js while this issue waits on the library
          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], labels: ["ready"], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "$ISSUE_NUMBER" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "ready") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next Ready issue #${NEXT_ISSUE} while #${ISSUE_NUMBER} waits on ${TARGET_REPO}#${LIB_ISSUE_NUMBER}..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi

      - name: Validate think.md contract
        if: steps.fifo.outputs.queued != 'true' && steps.escalate.outputs.escalated != 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          THINK_FILE="specs/issue-${ISSUE_NUMBER}/think.md"
          node .agents/skills/think/scripts/validate-think.mjs --think "$THINK_FILE"
          cat "$THINK_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment think.md on issue
        if: steps.fifo.outputs.queued != 'true' && steps.escalate.outputs.escalated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          THINK_FILE="specs/issue-${ISSUE_NUMBER}/think.md"
          EDITOR_REQ_FILE="specs/issue-${ISSUE_NUMBER}/editor-requests.json"
          gh issue comment "$ISSUE_NUMBER" --body-file "$THINK_FILE"
          if [ -s "$EDITOR_REQ_FILE" ] && jq -e 'type == "array" and length > 0' "$EDITOR_REQ_FILE" >/dev/null 2>&1; then
            SUMMARY=$(jq -r '.[] | "- **\(.editor)**: \(.title)"' "$EDITOR_REQ_FILE")
            gh issue comment "$ISSUE_NUMBER" --body "### Scheduled Companion Game Editor Updates

          Once this DoomR.js issue is implemented, proven, and merged into \`main\`, the pipeline will automatically open \`ready\` issues in the following companion game editors:

          ${SUMMARY}"
          fi
          echo "$ISSUE_NUMBER" > specs/issue_number.txt

      - name: Upload think.md artifact for Plan workflow
        if: steps.fifo.outputs.queued != 'true' && steps.escalate.outputs.escalated != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: think-spec
          path: |
            specs/issue_number.txt
            specs/issue-${{ github.event.issue.number || inputs.issue_number }}/think.md
            specs/issue-${{ github.event.issue.number || inputs.issue_number }}/editor-requests.json
          retention-days: 7

      - name: Advance FIFO queue if Think fails
        if: failure() && steps.fifo.outputs.queued != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          gh label create needs:developer --force --description "Pipeline failed or fix-loop limit reached; developer attention required" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "needs:developer" --remove-label "ready" || true

          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], labels: ["ready"], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "$ISSUE_NUMBER" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "ready") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next Ready issue #${NEXT_ISSUE}..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi
