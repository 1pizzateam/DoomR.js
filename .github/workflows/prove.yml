name: Prove and Validate PR

on:
  workflow_run:
    workflows: ["Implement Plan and Open PR"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to validate (optional if issue_number is provided)'
        required: false
        type: number
      issue_number:
        description: 'Issue number whose open PR should be validated (optional if pr_number is provided)'
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  FIX_LOOP_LIMIT: "5"

jobs:
  prove:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-prove-${{ github.event.pull_request.number || inputs.pr_number || inputs.issue_number || github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Resolve PR, branch, and issue number
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          PR_NUMBER=""
          ISSUE_NUMBER=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
          elif [ -n "$INPUT_PR_NUMBER" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          elif [ -n "$INPUT_ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$INPUT_ISSUE_NUMBER"
            PR_NUMBER=$(gh pr list --state open --json number,headRefName \
              --jq "[.[] | select(.headRefName | test(\"^(feature|fix|chore)/issue-${ISSUE_NUMBER}-\"))][0].number // empty")
          else
            # workflow_run after "Implement Plan and Open PR"
            PR_NUMBER=$(gh pr list --state open --json number,headRefName,updatedAt \
              --jq '[.[] | select(.headRefName | test("^(feature|fix|chore)/issue-[0-9]+-"))] | sort_by(.updatedAt) | reverse | .[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open agent pull request found to validate; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON=$(gh pr view "$PR_NUMBER" --json number,state,headRefName,baseRefName,body,title)
          PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is already ${PR_STATE}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_NAME=$(echo "$PR_JSON" | jq -r '.headRefName')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -nE 's/^(feature|fix|chore)\/issue-([0-9]+)-.*/\2/p')
          fi
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER=$(echo "$PR_JSON" | jq -r '.body // ""' | sed -nE 's/.*- \*\*Closes:\*\* #([0-9]+).*/\1/p' | head -n 1)
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::error::Could not determine ISSUE_NUMBER for PR #${PR_NUMBER} (branch ${BRANCH_NAME})."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          token: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}

      - name: Configure git identity and restore specs / PR body
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_REF"

          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          mkdir -p "$SPEC_DIR"

          if [ ! -s "${SPEC_DIR}/think.md" ]; then
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Think:"; "m"))] | last // empty' > "${SPEC_DIR}/think.md"
          fi
          if [ ! -s "${SPEC_DIR}/plan.md" ]; then
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Plan:"; "m"))] | last // empty' > "${SPEC_DIR}/plan.md"
          fi

          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' > pr-body.md

      - name: Install ALTEN-group/coding-pal Prove and Remediation primitives
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ALTEN-group/coding-pal.git /tmp/alten-coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/alten-coding-pal/instructions/sharp-agent.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/code-loop.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/prove.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/prove-controls.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/agents/prove.agent.md .github/agents/
          cp /tmp/alten-coding-pal/agents/gate-fix.agent.md .github/agents/
          cp /tmp/alten-coding-pal/agents/code.agent.md .github/agents/
          for skill in think plan code-loop pr-record prove scope-guard secret-guard dependency-guard task-gate control-guard test-probe preview-smoke criteria-verify; do
            cp -R "/tmp/alten-coding-pal/skills/${skill}" ".agents/skills/${skill}"
          done
          rm -rf /tmp/alten-coding-pal

          printf "%s\n" \
            ".github/instructions/" \
            ".github/agents/" \
            ".agents/" \
            "specs/issue_number.txt" \
            "reports/" \
            "pr-body.md" \
            "gate-output.log" >> .git/info/exclude
          echo '[{"path": "/", "status": 200, "maxMs": 2000}]' > /tmp/preview-routes.json

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.resolve.outputs.skip != 'true'
        run: npm ci
      - if: steps.resolve.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Run Prove validation and auto-remediation loop
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ALLOW_PENDING_APPROVAL: "1"
          ALLOW_AUTO_PROVE: "1"
        run: |
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          PROVE_FILE="${SPEC_DIR}/prove.md"
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')

          run_deterministic_controls() {
            mkdir -p reports
            : > gate-output.log
            local any_failed=0

            run_check() {
              local name="$1"
              shift
              echo "=== Control: ${name} ===" >> gate-output.log
              if "$@" >> gate-output.log 2>&1; then
                echo "✓ ${name}: PASS"
              else
                echo "✗ ${name}: FAIL"
                any_failed=1
              fi
            }

            run_check "validate-think" node .agents/skills/think/scripts/validate-think.mjs --think "${SPEC_DIR}/think.md" --stage draft
            run_check "validate-plan" node .agents/skills/plan/scripts/validate-plan.mjs --dir "$SPEC_DIR" --stage draft
            run_check "branch-guard" node .agents/skills/code-loop/scripts/branch-guard.mjs --git --base "$BASE_REF"
            run_check "code-loop" node .agents/skills/code-loop/scripts/code-loop.mjs check-history --dir "$SPEC_DIR" --base "origin/${BASE_REF}"
            run_check "control-guard" node .agents/skills/control-guard/scripts/control-guard.mjs --git "origin/${BASE_REF}"
            run_check "secret-guard" node .agents/skills/secret-guard/scripts/secret-guard.mjs --git --base "origin/${BASE_REF}"
            run_check "dependency-guard" node .agents/skills/dependency-guard/scripts/dependency-guard.mjs --git --base "origin/${BASE_REF}"

            SCOPE_ARGS=(--scope "${SPEC_DIR}/**" --scope "pr-body.md" --scope "reports/**")
            while IFS= read -r scope_glob; do
              [ -n "$scope_glob" ] && SCOPE_ARGS+=(--scope "$scope_glob")
            done < <(node -e '
              const fs = require("fs");
              const md = fs.readFileSync(process.argv[1], "utf8");
              const sec = md.match(/^##\s+In Scope\s*\n([\s\S]*?)(?:\n##\s+|$)/m);
              if (sec) {
                for (const m of sec[1].matchAll(/`([^`\n]+)`/g)) {
                  console.log(m[1].trim());
                }
              }
            ' "${SPEC_DIR}/plan.md")
            run_check "scope-guard" node .agents/skills/scope-guard/scripts/scope-guard.mjs --git --base "origin/${BASE_REF}" "${SCOPE_ARGS[@]}"
            run_check "task-gate" node .agents/skills/task-gate/scripts/task-gate.mjs --stage "test:npm test" --stage "build:npm run build"

            {
              echo "# file: tests/levels.test.mjs"
              node tests/levels.test.mjs || true
              echo "# file: tests/sim.test.mjs"
              node tests/sim.test.mjs || true
            } > reports/test-report.log
            run_check "criteria-verify" node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan "${SPEC_DIR}/plan.md" --report reports/test-report.log --require-test-files

            MODIFIED_SRCS=$(git diff --name-only --diff-filter=M "origin/${BASE_REF}..HEAD" -- 'src/**')
            if [ -n "$MODIFIED_SRCS" ]; then
              PROBE_ARGS=()
              for src in $MODIFIED_SRCS; do
                PROBE_ARGS+=(--source "$src")
              done
              run_check "test-probe" node .agents/skills/test-probe/scripts/test-probe.mjs --base "origin/${BASE_REF}" --test-cmd "npm test" "${PROBE_ARGS[@]}"
            else
              echo "=== Control: test-probe ===" >> gate-output.log
              echo "N/A (no existing tracked src/** files modified)" >> gate-output.log
            fi

            npx vite preview --port 4173 --host 127.0.0.1 >/tmp/vite-preview.log 2>&1 &
            PREVIEW_PID=$!
            run_check "preview-smoke" node .agents/skills/preview-smoke/scripts/preview-smoke.mjs --url http://127.0.0.1:4173 --routes /tmp/preview-routes.json --timeout-ms 5000 --retries 5 --retry-delay-ms 1000
            kill "$PREVIEW_PID" 2>/dev/null || true

            run_check "validate-pr" node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir "$SPEC_DIR" --stage code --allow-pending-approval

            return $any_failed
          }

          while true; do
            CONTROLS_OK=0
            if run_deterministic_controls; then
              CONTROLS_OK=1
            fi

            copilot --agent="prove" --allow-all-tools \
              --prompt "Run the Prove validation for Pull Request #${PR_NUMBER} (GitHub Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}) on branch ${BRANCH_NAME} (base: ${BASE_REF}).

            Follow .github/instructions/prove.instructions.md, .agents/skills/prove/SKILL.md, and .agents/skills/prove/references/prove-contract.md.
            1. Read ${SPEC_DIR}/think.md, ${SPEC_DIR}/plan.md, pr-body.md, gate-output.log, and inspect the diff with git diff origin/${BASE_REF}...HEAD.
            2. Write the Prove record to ${PROVE_FILE} with exact header links (- **Issue:** #${ISSUE_NUMBER}, - **PR:** #${PR_NUMBER}, - **Think:** \`${SPEC_DIR}/think.md\`, - **Plan:** \`${SPEC_DIR}/plan.md\`, - **Branch:** \`${BRANCH_NAME}\`, - **Base:** \`${BASE_REF}\`).
            3. Record the truthful status of all 13 required deterministic controls from gate-output.log, verify every AC-<n> criterion against the implementation and tests, and evaluate Client Intent, Behavioral Experience, and Safety & Blast Radius.
            4. Validate ${PROVE_FILE} until it exits 0:
               node .agents/skills/prove/scripts/validate-prove.mjs --dir ${SPEC_DIR} --stage draft"

            if [ "$CONTROLS_OK" -eq 1 ] && node .agents/skills/prove/scripts/validate-prove.mjs --dir "$SPEC_DIR" --stage pass; then
              echo "✓ Prove validation passed!"
              break
            fi

            ATTEMPTS=$(gh pr view "$PR_NUMBER" --json labels \
              --jq '[.labels[].name | select(startswith("fix-loop:")) | ltrimstr("fix-loop:") | tonumber] | max // 0')

            if [ "$ATTEMPTS" -ge "$FIX_LOOP_LIMIT" ]; then
              gh label create needs:developer --force --description "Fix-loop limit reached" || true
              gh pr edit "$PR_NUMBER" --add-label needs:developer
              if [ -f "$PROVE_FILE" ]; then
                gh pr review "$PR_NUMBER" --request-changes --body-file "$PROVE_FILE" || gh pr comment "$PR_NUMBER" --body-file "$PROVE_FILE"
              fi
              gh pr comment "$PR_NUMBER" --body "Fix-loop limit of ${FIX_LOOP_LIMIT} reached during Prove validation. Automatic remediation stops here and the Developer steps in."
              exit 1
            fi

            NEXT=$((ATTEMPTS + 1))
            gh label create "fix-loop:${NEXT}" --force --description "Auto-remediation attempt ${NEXT}" || true
            gh pr edit "$PR_NUMBER" --add-label "fix-loop:${NEXT}"
            if [ "$ATTEMPTS" -gt 0 ]; then
              gh pr edit "$PR_NUMBER" --remove-label "fix-loop:${ATTEMPTS}" || true
            fi

            BEFORE=$(git rev-parse HEAD)
            copilot --agent="gate-fix" --allow-all-tools \
              --prompt "Remediate the failing Prove controls and findings for Pull Request #${PR_NUMBER} (Issue #${ISSUE_NUMBER}, attempt ${NEXT}/${FIX_LOOP_LIMIT}).

            Read gate-output.log and ${PROVE_FILE} (especially ## Findings), plus ${SPEC_DIR}/plan.md and pr-body.md.
            Follow .github/instructions/prove-controls.instructions.md and .github/agents/gate-fix.agent.md:
            1. Fix only the application/test files within the In Scope paths of ${SPEC_DIR}/plan.md (and update pr-body.md if validate-pr failed).
            2. Never weaken, skip, or edit any control or spec file.
            3. Re-run the failed checks and node .agents/skills/control-guard/scripts/control-guard.mjs --git origin/${BASE_REF}.
            4. Stage and commit your fix on ${BRANCH_NAME} with a clear message referencing #${ISSUE_NUMBER}."

            if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
              node .agents/skills/control-guard/scripts/control-guard.mjs --git "origin/${BASE_REF}"
              git push origin "$BRANCH_NAME"
            fi
          done

      - name: Record Human Validation, approve PR, and auto-merge
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          ALLOW_PENDING_APPROVAL: "1"
          ALLOW_AUTO_PROVE: "1"
        run: |
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          PROVE_FILE="${SPEC_DIR}/prove.md"

          node .agents/skills/prove/scripts/validate-prove.mjs --dir "$SPEC_DIR" --stage pass
          cat "$PROVE_FILE" >> "$GITHUB_STEP_SUMMARY"

          git add "$PROVE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "docs(prove): add validated prove.md for issue #${ISSUE_NUMBER}"
            git push origin "$BRANCH_NAME"
          fi

          # Update Human Validation in pr-body.md to Auto-merge for Low/Medium blast radius and validate at prove stage
          node -e '
            const fs = require("fs");
            let body = fs.readFileSync("pr-body.md", "utf8");
            for (const q of ["Client Intent", "Behavioral Experience", "Safety & Blast Radius"]) {
              body = body.replace(new RegExp(`(- \\*\\*${q}:\\*\\*)\\s*Pending`, "g"), "$1 Auto-merge");
            }
            fs.writeFileSync("pr-body.md", body);
          '
          TODAY=$(date -u +%Y-%m-%d)
          node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir "$SPEC_DIR" --stage prove --pr-date "$TODAY" --allow-auto-prove
          gh pr edit "$PR_NUMBER" --body-file pr-body.md

          # Post Prove validation report on the PR (approve if token differs from author, otherwise comment)
          gh pr review "$PR_NUMBER" --approve --body-file "$PROVE_FILE" || gh pr comment "$PR_NUMBER" --body-file "$PROVE_FILE"

          # Auto-merge the PR and delete the short-lived branch
          gh pr merge "$PR_NUMBER" --squash --delete-branch

      - name: Sync issue to Done on DoomR Project board
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: DoomR
          TARGET_STATUS: Done
        run: |
          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE" 2>/dev/null || true)

          if [ -z "$DATA" ]; then exit 0; fi
          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase) == ($title | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[] | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)
          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then exit 0; fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null

      - name: Upload prove.md artifact
        if: steps.resolve.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: prove-spec
          path: |
            specs/issue-${{ env.ISSUE_NUMBER }}/prove.md
            pr-body.md
