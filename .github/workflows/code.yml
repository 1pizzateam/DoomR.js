name: Code Plan and Open PR

on:
  workflow_run:
    workflows: ["Plan from Think Spec"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement from plan.md'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  code:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-code-${{ inputs.issue_number || github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Resolve issue number and restore think.md and plan.md
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          rm -rf /tmp/specs
          mkdir -p /tmp/specs

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if ! gh run download "$RUN_ID" -n plan-spec -D /tmp/specs 2>/dev/null; then
              echo "Triggering Plan workflow run (#${RUN_ID}) was skipped (no plan-spec artifact); skipping Code."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ISSUE_NUMBER=$(tr -d '[:space:]' < /tmp/specs/issue_number.txt)
          else
            ISSUE_NUMBER="$INPUT_ISSUE_NUMBER"
            echo "$ISSUE_NUMBER" > /tmp/specs/issue_number.txt
          fi

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::error::Could not determine ISSUE_NUMBER."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          SPEC_DIR="/tmp/specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          PLAN_FILE="${SPEC_DIR}/plan.md"
          mkdir -p "$SPEC_DIR"

          if [ ! -s "$THINK_FILE" ]; then
            echo "Fetching latest think.md from issue #${ISSUE_NUMBER} comments..."
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Think:"; "m"))] | last // empty' > "$THINK_FILE"
          fi

          if [ ! -s "$PLAN_FILE" ]; then
            echo "Fetching latest plan.md from issue #${ISSUE_NUMBER} comments..."
            gh issue view "$ISSUE_NUMBER" --json comments \
              --jq '[.comments[].body | select(test("^# Plan:"; "m"))] | last // empty' > "$PLAN_FILE"
          fi

          if [ ! -s "$THINK_FILE" ] || [ ! -s "$PLAN_FILE" ]; then
            echo "::error::Missing think.md or plan.md for issue #${ISSUE_NUMBER}. Run Think and Plan workflows first."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Configure git identity and restore specs
        if: steps.resolve.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p specs
          cp -R /tmp/specs/. specs/

      - name: Sync issue to In progress on DoomR Project board
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: DoomR
          TARGET_STATUS: In progress
        run: |
          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE" 2>/dev/null || true)

          if [ -z "$DATA" ]; then exit 0; fi
          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase) == ($title | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[] | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)
          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then exit 0; fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null

      - name: Prepare implementation branch and commit specs
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-36 | sed -E 's/-+$//')
          if [ -z "$SLUG" ]; then SLUG="implementation"; fi
          BRANCH_NAME="feature/issue-${ISSUE_NUMBER}-${SLUG}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

          git checkout -B "$BRANCH_NAME"
          git add "specs/issue-${ISSUE_NUMBER}/think.md" "specs/issue-${ISSUE_NUMBER}/plan.md"
          if [ -f "specs/issue-${ISSUE_NUMBER}/editor-requests.json" ]; then
            git add "specs/issue-${ISSUE_NUMBER}/editor-requests.json"
          fi
          git commit -m "docs(specs): add think.md and plan.md for issue #${ISSUE_NUMBER}"

      - name: Install ALTEN-group/coding-pal code primitives
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ALTEN-group/coding-pal.git /tmp/alten-coding-pal
          rm -rf .github/instructions .github/agents .github/prompts .github/skills .github/copilot-instructions.md .agents .claude .cursor .gemini CLAUDE.md GEMINI.md AGENTS.md .cursorrules .windsurfrules
          mkdir -p .github/instructions .github/agents .agents/skills
          cp /tmp/alten-coding-pal/instructions/sharp-agent.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/instructions/code-loop.instructions.md .github/instructions/
          cp /tmp/alten-coding-pal/agents/code.agent.md .github/agents/
          for skill in plan code-loop pr-record scope-guard secret-guard dependency-guard task-gate control-guard test-probe preview-smoke criteria-verify; do
            cp -R "/tmp/alten-coding-pal/skills/${skill}" ".agents/skills/${skill}"
          done
          rm -rf /tmp/alten-coding-pal

          printf "%s\n" \
            ".github/instructions/" \
            ".github/agents/" \
            ".agents/" \
            "specs/issue_number.txt" \
            "specs/pr_number.txt" \
            "reports/" \
            "pr-body.md" >> .git/info/exclude
          echo '[{"path": "/", "status": 200, "maxMs": 2000}]' > /tmp/preview-routes.json

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.resolve.outputs.skip != 'true'
        run: npm ci
      - if: steps.resolve.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Run Code Agent to implement plan.md and prepare pr-body.md
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ALLOW_PENDING_APPROVAL: "1"
        run: |
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          THINK_FILE="${SPEC_DIR}/think.md"
          PLAN_FILE="${SPEC_DIR}/plan.md"

          copilot --agent="code" --allow-all-tools \
            --prompt "Implement the validated Plan record at ${PLAN_FILE} (with ${THINK_FILE}) for GitHub Issue #${ISSUE_NUMBER} (${ISSUE_TITLE}) on the current branch ${BRANCH_NAME}.

          Follow .github/instructions/code-loop.instructions.md, .agents/skills/code-loop/SKILL.md, and .agents/skills/pr-record/SKILL.md.
          1. Validate specs first: node .agents/skills/plan/scripts/validate-plan.mjs --dir ${SPEC_DIR} --stage draft
          2. Check the branch: node .agents/skills/code-loop/scripts/branch-guard.mjs --git --base main
          3. Drive the implementation loop one step at a time using code-loop:
             - node .agents/skills/code-loop/scripts/code-loop.mjs next --dir ${SPEC_DIR} --allow-pending-approval
             - node .agents/skills/code-loop/scripts/code-loop.mjs start <n> --dir ${SPEC_DIR} --allow-pending-approval
             - Apply Step <n>'s New Code (writing only files in Step <n>'s Files and within In Scope).
             - Run Step <n>'s Verification and Bootable Check commands, plus:
               - node .agents/skills/task-gate/scripts/task-gate.mjs --stage 'test:npm test' --stage 'build:npm run build'
               - node .agents/skills/scope-guard/scripts/scope-guard.mjs --git --scope '${SPEC_DIR}/**' (plus a --scope flag for each In Scope path in ${PLAN_FILE})
               - node .agents/skills/secret-guard/scripts/secret-guard.mjs --git
               - node .agents/skills/dependency-guard/scripts/dependency-guard.mjs --git
               - node .agents/skills/control-guard/scripts/control-guard.mjs --git origin/main
             - If any check fails, record with code-loop.mjs fail <n> --reason '<reason>' --dir ${SPEC_DIR}, fix the code, and re-run checks.
             - When green, record with: node .agents/skills/code-loop/scripts/code-loop.mjs pass <n> --dir ${SPEC_DIR}
             - Stage and commit Step <n>'s modified files and ${SPEC_DIR}/progress.json with a commit message referencing Step <n> and #${ISSUE_NUMBER}.
          4. Repeat until all steps in ${PLAN_FILE} are done in ${SPEC_DIR}/progress.json.
          5. Before authoring the PR body, run the full verification controls across the completed implementation:
             - Ensure every acceptance criterion test in tests/sim.test.mjs includes its AC-<n> token in the test name, capture the test output into reports/test-report.log (prefixed with '# file: tests/levels.test.mjs' and '# file: tests/sim.test.mjs'), and run:
               node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan ${PLAN_FILE} --report reports/test-report.log --require-test-files
             - For modified tracked source files under src/**, verify test falsifiability with:
               node .agents/skills/test-probe/scripts/test-probe.mjs --base origin/main --test-cmd 'npm test' --source <each modified src/** file>
             - Verify control integrity with:
               node .agents/skills/control-guard/scripts/control-guard.mjs --git origin/main
          6. Author the pull request body at pr-body.md following .agents/skills/pr-record/references/pr-record-contract.md (with ## Links, ## Acceptance Criteria Traceability, ## Dependencies, ## Blast Radius, and ## Human Validation all set to Pending) and validate it until it exits 0:
             node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir ${SPEC_DIR} --stage code --allow-pending-approval"

      - name: Run deterministic Code exit gates
        if: steps.resolve.outputs.skip != 'true'
        env:
          ALLOW_PENDING_APPROVAL: "1"
        run: |
          SPEC_DIR="specs/issue-${ISSUE_NUMBER}"
          if [ -f "${SPEC_DIR}/progress.json" ] && ! git diff --quiet "${SPEC_DIR}/progress.json"; then
            git add "${SPEC_DIR}/progress.json"
            git commit -m "chore(code-loop): record final progress for #${ISSUE_NUMBER}"
          fi
          node .agents/skills/code-loop/scripts/branch-guard.mjs --git --base main
          node .agents/skills/code-loop/scripts/code-loop.mjs check-history --dir "$SPEC_DIR" --base origin/main
          node .agents/skills/control-guard/scripts/control-guard.mjs --git origin/main
          node .agents/skills/secret-guard/scripts/secret-guard.mjs --git --base origin/main
          node .agents/skills/dependency-guard/scripts/dependency-guard.mjs --git --base origin/main
          SCOPE_ARGS=(--scope "${SPEC_DIR}/**" --scope "pr-body.md" --scope "reports/**")
          while IFS= read -r scope_glob; do
            [ -n "$scope_glob" ] && SCOPE_ARGS+=(--scope "$scope_glob")
          done < <(node -e '
            const fs = require("fs");
            const md = fs.readFileSync(process.argv[1], "utf8");
            const sec = md.match(/^##\s+In Scope\s*\n([\s\S]*?)(?:\n##\s+|$)/m);
            if (sec) {
              for (const m of sec[1].matchAll(/`([^`\n]+)`/g)) {
                console.log(m[1].trim());
              }
            }
          ' "${SPEC_DIR}/plan.md")
          node .agents/skills/scope-guard/scripts/scope-guard.mjs --git --base origin/main "${SCOPE_ARGS[@]}"
          node .agents/skills/task-gate/scripts/task-gate.mjs --stage "test:npm test" --stage "build:npm run build"

          mkdir -p reports
          {
            echo "# file: tests/levels.test.mjs"
            node tests/levels.test.mjs
            echo "# file: tests/sim.test.mjs"
            node tests/sim.test.mjs
          } | tee reports/test-report.log
          node .agents/skills/criteria-verify/scripts/verify-criteria.mjs --plan "${SPEC_DIR}/plan.md" --report reports/test-report.log --require-test-files >> "$GITHUB_STEP_SUMMARY"

          MODIFIED_SRCS=$(git diff --name-only --diff-filter=M origin/main..HEAD -- 'src/**')
          if [ -n "$MODIFIED_SRCS" ]; then
            PROBE_ARGS=()
            for src in $MODIFIED_SRCS; do
              PROBE_ARGS+=(--source "$src")
            done
            node .agents/skills/test-probe/scripts/test-probe.mjs --base origin/main --test-cmd "npm test" "${PROBE_ARGS[@]}"
          fi

          npx vite preview --port 4173 --host 127.0.0.1 >/tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          node .agents/skills/preview-smoke/scripts/preview-smoke.mjs --url http://127.0.0.1:4173 --routes /tmp/preview-routes.json --timeout-ms 5000 --retries 5 --retry-delay-ms 1000
          kill "$PREVIEW_PID" 2>/dev/null || true

          node .agents/skills/pr-record/scripts/validate-pr.mjs --body pr-body.md --dir "$SPEC_DIR" --stage code --allow-pending-approval
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push branch and open Pull Request
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          PR_TITLE="feat(issue-${ISSUE_NUMBER}): ${ISSUE_TITLE}"

          git push --force-with-lease origin "$BRANCH_NAME"

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body-file pr-body.md
            PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq '.url')
          else
            PR_URL=$(gh pr create --base main --head "$BRANCH_NAME" --title "$PR_TITLE" --body-file pr-body.md)
            PR_NUMBER=$(gh pr view "$BRANCH_NAME" --json number --jq '.number')
          fi

          echo "$PR_NUMBER" > specs/pr_number.txt
          echo "$ISSUE_NUMBER" > specs/issue_number.txt
          gh issue comment "$ISSUE_NUMBER" --body "Pull request opened for #${ISSUE_NUMBER}: ${PR_URL}"

      - name: Sync issue to In review on DoomR Project board
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PROJECT_TITLE: DoomR
          TARGET_STATUS: In review
        run: |
          DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!, $projectTitle: String!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
                owner {
                  ... on ProjectV2Owner {
                    projectsV2(first: 20, query: $projectTitle) {
                      nodes {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$ISSUE_NUMBER" -f projectTitle="$PROJECT_TITLE" 2>/dev/null || true)

          if [ -z "$DATA" ]; then exit 0; fi
          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT=$(echo "$DATA" | jq -c --arg title "$PROJECT_TITLE" '.data.repository.owner.projectsV2.nodes[]? | select((.title | ascii_downcase) == ($title | ascii_downcase))' | head -n 1)
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id // empty')
          FIELD_ID=$(echo "$PROJECT" | jq -r '.field.id // empty')
          OPTION_ID=$(echo "$PROJECT" | jq -r --arg status "$TARGET_STATUS" '.field.options[] | select((.name | ascii_downcase) == ($status | ascii_downcase)) | .id' | head -n 1)
          if [ -z "$ISSUE_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then exit 0; fi

          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
            }' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                value: { singleSelectOptionId: $optionId }
              }) { projectV2Item { id } }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$FIELD_ID" -f optionId="$OPTION_ID" >/dev/null

      - name: Upload code-spec artifact for Prove workflow
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: code-spec
          path: |
            specs/issue_number.txt
            specs/pr_number.txt
            specs/issue-${{ env.ISSUE_NUMBER }}/think.md
            specs/issue-${{ env.ISSUE_NUMBER }}/plan.md
            specs/issue-${{ env.ISSUE_NUMBER }}/editor-requests.json
          retention-days: 7

      - name: Advance FIFO queue if Code fails
        if: failure() && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh label create needs:developer --force --description "Pipeline failed or fix-loop limit reached; developer attention required" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "needs:developer" --remove-label "ready" || true
          fi

          QUEUE_DATA=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                issues(states: [OPEN], labels: ["ready"], first: 100) {
                  nodes {
                    number
                    createdAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(itemTypes: [LABELED_EVENT], last: 20) {
                      nodes {
                        ... on LabeledEvent {
                          createdAt
                          label { name }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" 2>/dev/null || true)

          NEXT_ISSUE=$(echo "$QUEUE_DATA" | jq -r --argjson current "${ISSUE_NUMBER:-0}" '
            [
              .data.repository.issues.nodes[]?
              | select(.number != $current)
              | select(([.labels.nodes[].name] | index("needs:developer")) == null)
              | {
                  number: .number,
                  readyAt: (([.timelineItems.nodes[]? | select(.label.name == "ready") | .createdAt] | last) // .createdAt)
                }
            ]
            | sort_by(.readyAt, .number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "Advancing FIFO queue to next Ready issue #${NEXT_ISSUE}..."
            gh workflow run think.yml -f issue_number="$NEXT_ISSUE"
          fi
