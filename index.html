<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoomR · a line-art shooter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07090f; overflow: hidden; }
    canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
    /* when the 3D view is drawn smaller than the screen it is scaled up in hard pixels, not smoothed */
    #world { image-rendering: pixelated; }
    #hud { cursor: crosshair; }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="hud"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
