services:

  doomr:
    build: ./
    container_name: doomr
    environment:
      VITE_WATCH_POLLING: "true"
    ports:
      - "5177:5173"
    volumes:
      - ./:/usr/src/app
      - doomr_node_modules:/usr/src/app/node_modules

volumes:
  doomr_node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/node_modules
